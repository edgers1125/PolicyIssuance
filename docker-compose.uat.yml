# UAT / staging stack — completely separate from the dev stack in
# docker-compose.yml (own project name, own database volume, no bind mounts,
# no hot reload). Configure via .env.uat (copy .env.uat.example).
#
#   docker compose -f docker-compose.uat.yml --env-file .env.uat up -d --build
#   docker compose -f docker-compose.uat.yml --env-file .env.uat logs -f app
name: policyissuance-uat

services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER in .env.uat}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.uat}
      POSTGRES_DB: ${POSTGRES_DB:-policyissuance_uat}
    # Not published to the host — only the app container can reach it.
    volumes:
      - uat_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile.uat
    image: policyissuance-uat:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-policyissuance_uat}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env.uat}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      # The URL testers open in their browser — used to build the links in
      # invite / password-reset emails.
      FRONTEND_URL: ${FRONTEND_URL:?set FRONTEND_URL in .env.uat}
      RUN_SEED: ${RUN_SEED:-false}
      SEED_ADMIN_EMAIL: ${SEED_ADMIN_EMAIL:-}
      SEED_ADMIN_PASSWORD: ${SEED_ADMIN_PASSWORD:-}
      SEED_ADMIN_FULL_NAME: ${SEED_ADMIN_FULL_NAME:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "${UAT_PORT:-8080}:4000"

volumes:
  uat_pgdata:
